<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Delegate</title>
</head>
<body>
    <h1>Explore Event Delegate</h1>

    <section>
        <ul id="list-container">
            <li class="item">Lorem ipsum dolor sit amet.</li>
            <li class="item">Eveniet dicta ex doloribus omnis.</li>
            <li class="item">Iste tempore inventore reiciendis tenetur.</li>
            <li class="item">Laudantium atque dolor repudiandae dolores.</li>
            <li class="item">Magnam eaque vitae fuga necessitatibus!</li>
            <li class="item">Illum maiores fuga ratione non.</li>
        </ul>
        <button id="btn-add-item">Add Item</button>
    </section>

    <script>
      

        document.getElementById('list-container').addEventListener('click',function(event){
            console.log(event.target)
             event.target.parentNode.removeChild(event.target)
        })

        // const items =document.getElementsByClassName('item');
        // // console.log(items)
        // for(const item of items){
        //     item.addEventListener('click',function(event){
        //         // console.log(event.target.parentNode)
        //         event.target.parentNode.removeChild(event.target)
        //     })

        // }
          document.getElementById('btn-add-item').addEventListener('click',function(){
            const listContainer =document.getElementById('list-container');
            const li =document.createElement('li');
            li.innerText='brand new item added';
            li.classList.add('item')
            listContainer.appendChild(li)
        })
    </script>

</body>
</html>
